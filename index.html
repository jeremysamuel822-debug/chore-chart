<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chore Stars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F4FB;
      --surface: #FFFFFF;
      --text: #111827;
      --text-2: #6B7280;
      --text-3: #9CA3AF;
      --border: #EFEFEF;
      --dark: #111827;
      --indigo: #5B5BD6;
      --gold: #F59E0B;
      --gold-deep: #D97706;
      --r: 20px;
      --r-sm: 12px;
      --shadow-xs: 0 1px 4px rgba(0,0,0,.05);
      --shadow-sm: 0 2px 10px rgba(0,0,0,.07);
      --shadow: 0 4px 20px rgba(0,0,0,.1);
      --shadow-lg: 0 16px 48px rgba(0,0,0,.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      overflow: hidden;
    }
    .app-shell {
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* ── Header ── */
    .topbar {
      flex-shrink: 0;
      padding: 20px 22px 10px;
      padding-top: calc(20px + env(safe-area-inset-top));
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .brand h1 { font-size: 1.5rem; font-weight: 900; color: var(--text); letter-spacing: -.03em; }
    .brand p  { font-size: .75rem; color: var(--text-2); font-weight: 600; margin-top: 2px; }

    .star-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border-radius: 99px;
      padding: 8px 14px 8px 10px;
      box-shadow: var(--shadow-sm);
    }
    .star-pill svg { width: 20px; height: 20px; flex-shrink: 0; }
    .star-pill .num { font-size: 1.1rem; font-weight: 900; color: var(--text); line-height: 1; }
    .star-pill .num.pop { animation: numPop .35s cubic-bezier(.34,1.56,.64,1); }
    @keyframes numPop { 0%,100%{transform:scale(1)} 45%{transform:scale(1.45)} }
    .star-pill .lbl { font-size: .58rem; font-weight: 800; color: var(--text-3); letter-spacing: .07em; text-transform: uppercase; }

    /* ── Next reward dark card ── */
    .reward-card-strip { flex-shrink: 0; padding: 6px 22px 14px; }
    .next-reward-card {
      background: var(--dark);
      border-radius: var(--r);
      padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
    }
    .nrc-icon { font-size: 1.6rem; flex-shrink: 0; line-height: 1; }
    .nrc-body { flex: 1; min-width: 0; }
    .nrc-label   { font-size: .6rem; color: rgba(255,255,255,.5); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
    .nrc-reward  { font-size: .82rem; font-weight: 800; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nrc-right   { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .nrc-stars   { font-size: .68rem; font-weight: 800; color: rgba(255,255,255,.55); white-space: nowrap; }
    .nrc-mini-track { width: 64px; height: 5px; background: rgba(255,255,255,.15); border-radius: 99px; overflow: hidden; }
    .nrc-mini-fill  { height: 100%; background: var(--gold); border-radius: 99px; transition: width .5s cubic-bezier(.34,1.2,.64,1); }
    .nrc-rewards-btn {
      border: none; background: rgba(255,255,255,.12); color: white;
      font-family: inherit; font-size: .68rem; font-weight: 800;
      border-radius: 99px; padding: 5px 11px; cursor: pointer; transition: background .18s;
    }
    .nrc-rewards-btn:hover { background: rgba(255,255,255,.22); }

    /* ── Rewards drawer ── */
    .rewards-drawer {
      flex-shrink: 0; display: none;
      background: var(--surface);
      margin: 0 22px; border-radius: var(--r);
      padding: 16px; margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
    }
    .rewards-drawer.open { display: block; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .drawer-head span { font-size: .85rem; font-weight: 800; }
    .drawer-close {
      width: 26px; height: 26px; border-radius: 8px; border: none;
      background: var(--bg); cursor: pointer; color: var(--text-3);
      font-size: .8rem; display: flex; align-items: center; justify-content: center;
    }
    .rewards-grid {
      display: flex; gap: 8px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; padding-bottom: 4px;
    }
    .rewards-grid::-webkit-scrollbar { display: none; }
    .r-card {
      flex-shrink: 0; width: 100px;
      background: var(--bg); border-radius: var(--r-sm);
      padding: 12px 8px; text-align: center;
      border: 1.5px solid var(--border);
      transition: border-color .18s;
    }
    .r-card.unlocked { border-color: #10B981; background: #F0FDF4; }
    .r-card.current  { border-color: var(--indigo); background: #EEF2FF; }
    .r-card .rc-icon { font-size: 1.3rem; line-height: 1.5; }
    .r-card .rc-stars { font-size: .6rem; font-weight: 800; color: var(--text-3); margin: 3px 0 2px; }
    .r-card.unlocked .rc-stars { color: #059669; }
    .r-card.current  .rc-stars { color: var(--indigo); }
    .r-card .rc-t { font-size: .55rem; font-weight: 700; color: var(--text-2); line-height: 1.4; }
    .r-card.unlocked .rc-t { color: #065F46; }
    .r-card.current  .rc-t { color: #3730A3; }
    .edit-rewards-link {
      display: block; margin-top: 10px; border: none; background: none;
      font-family: inherit; font-size: .7rem; font-weight: 700;
      color: var(--text-3); cursor: pointer; width: 100%; text-align: center; padding: 2px;
    }
    .edit-rewards-link:hover { color: var(--indigo); }

    /* ── Tabs ── */
    .tabs-row { flex-shrink: 0; padding: 0 22px 12px; }
    .tabs-inner {
      display: flex; background: var(--surface);
      border-radius: 99px; padding: 4px; gap: 2px;
      box-shadow: var(--shadow-xs);
    }
    .tab-btn {
      flex: 1; padding: 10px 6px;
      border: none; background: transparent;
      font-family: inherit; font-size: .72rem; font-weight: 800;
      color: var(--text-3); border-radius: 99px;
      cursor: pointer; transition: all .2s;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      line-height: 1;
    }
    .tab-btn.active { background: var(--dark); color: white; }
    .t-badge {
      font-size: .55rem; font-weight: 800; padding: 1px 5px;
      border-radius: 99px; background: rgba(0,0,0,.06); color: var(--text-3);
    }
    .tab-btn.active .t-badge { background: rgba(255,255,255,.18); color: rgba(255,255,255,.8); }

    /* ── Chore scroll ── */
    .chore-scroll {
      flex: 1; overflow-y: auto; padding: 0 22px;
      -webkit-overflow-scrolling: touch;
    }
    .chore-scroll::-webkit-scrollbar { display: none; }

    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-head-l .section-title { font-size: 1.15rem; font-weight: 900; letter-spacing: -.02em; }
    .section-head-l .section-sub   { font-size: .72rem; color: var(--text-2); font-weight: 600; margin-top: 2px; }
    .complete-all-btn {
      border: 1.5px solid var(--border); background: transparent;
      font-family: inherit; font-size: .68rem; font-weight: 800;
      color: var(--text-2); border-radius: 99px; padding: 7px 13px;
      cursor: pointer; white-space: nowrap; transition: all .18s;
    }
    .complete-all-btn:hover { background: var(--dark); color: white; border-color: var(--dark); }

    .chore-list { display: flex; flex-direction: column; gap: 8px; }

    .chore-item {
      display: flex; align-items: center; gap: 12px;
      border-radius: var(--r);
      padding: 15px 16px;
      cursor: pointer; user-select: none;
      transition: transform .12s, opacity .2s;
      position: relative; overflow: hidden;
      min-height: 58px;
    }
    .chore-item:active { transform: scale(.97); }
    .chore-item.done { opacity: .6; }
    .chore-item.done .chore-text { text-decoration: line-through; }

    .star-cb { flex-shrink: 0; width: 28px; height: 28px; display: block; }
    .star-cb.checked { animation: starBurst .38s cubic-bezier(.34,1.56,.64,1); }
    @keyframes starBurst {
      0%   { transform: scale(1) rotate(0deg); }
      42%  { transform: scale(1.5) rotate(-12deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .chore-text { font-size: .88rem; font-weight: 800; flex: 1; }

    .star-float {
      position: absolute; right: 14px; top: 50%;
      font-size: .88rem; font-weight: 900; color: var(--gold-deep);
      pointer-events: none; animation: floatUp .8s ease forwards;
      display: flex; align-items: center; gap: 3px;
    }
    @keyframes floatUp {
      0%   { opacity:1; transform:translateY(-50%) scale(1); }
      80%  { opacity:1; transform:translateY(calc(-50% - 28px)) scale(1.1); }
      100% { opacity:0; transform:translateY(calc(-50% - 46px)) scale(.9); }
    }

    .period-bar { margin-top: 14px; padding-bottom: 16px; }
    .pb-label { font-size: .65rem; font-weight: 800; color: var(--text-3); margin-bottom: 6px; }
    .pb-track { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .pb-fill  { height: 100%; background: var(--dark); border-radius: 99px; transition: width .4s; }

    /* ── Reset ── */
    .reset-zone {
      flex-shrink: 0; text-align: center;
      padding: 8px 0 calc(16px + env(safe-area-inset-bottom));
    }
    .reset-all-btn {
      background: none; border: none; font-family: inherit;
      font-size: .68rem; font-weight: 700; color: var(--text-3);
      cursor: pointer; padding: 6px 12px; border-radius: 8px;
    }
    .reset-all-btn:hover { color: #F43F5E; }

    /* ── Modals (sheet style) ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4); backdrop-filter: blur(6px);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .overlay.show { opacity:1; pointer-events:all; }
    .modal {
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
      width: 100%; max-width: 430px;
      text-align: center;
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(.34,1.2,.64,1);
    }
    .overlay.show .modal { transform: translateY(0); }
    .modal-handle { width: 36px; height: 4px; background: #E5E7EB; border-radius: 99px; margin: 0 auto 20px; }
    .modal-icon  { font-size: 2.8rem; display: block; margin-bottom: 10px; }
    .modal-title { font-size: 1.35rem; font-weight: 900; letter-spacing: -.02em; margin-bottom: 4px; }
    .modal-sub   { font-size: .82rem; color: var(--text-2); font-weight: 700; margin-bottom: 18px; }
    .modal-reward-lbl { font-size: .6rem; font-weight: 800; color: var(--text-3); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
    .modal-reward-box {
      background: #FFFDE7; border: 1.5px solid #FDE68A;
      border-radius: 14px; padding: 14px; margin-bottom: 18px;
      font-size: .95rem; font-weight: 800; color: #92400E;
    }
    .modal-cta {
      background: var(--dark); color: white; border: none; border-radius: 14px;
      padding: 15px; font-family: inherit; font-size: .95rem; font-weight: 800;
      cursor: pointer; width: 100%; transition: opacity .18s;
    }
    .modal-cta:hover { opacity: .85; }

    .edit-modal { text-align: left; }
    .edit-modal .modal-title { text-align: center; margin-bottom: 18px; }
    .edit-field { margin-bottom: 11px; }
    .edit-field label { display: block; font-size: .7rem; font-weight: 800; color: var(--text-2); margin-bottom: 5px; }
    .edit-field input {
      width: 100%; border: 1.5px solid var(--border); border-radius: var(--r-sm);
      padding: 11px 12px; font-family: inherit; font-size: .88rem; font-weight: 700;
      color: var(--text); outline: none; background: var(--bg); transition: border-color .18s;
    }
    .edit-field input:focus { border-color: var(--dark); background: var(--surface); }
    .edit-btns { display: flex; gap: 8px; margin-top: 6px; }
    .btn-primary   { flex:1; background:var(--dark); color:white; border:none; border-radius:12px; padding:13px; font-family:inherit; font-size:.88rem; font-weight:800; cursor:pointer; }
    .btn-secondary { flex:1; background:var(--bg); color:var(--text-2); border:1.5px solid var(--border); border-radius:12px; padding:13px; font-family:inherit; font-size:.88rem; font-weight:800; cursor:pointer; }

    #confetti-canvas { position:fixed; inset:0; pointer-events:none; z-index:999; display:none; }

    @media (min-width: 431px) {
      .overlay { align-items: center; }
      .modal { border-radius: 28px; max-width: 400px; padding-bottom: 28px; }
    }
    @media (max-width: 380px) {
      .tab-btn { font-size: .65rem; }
    }
  </style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<div class="app-shell">

  <!-- Header -->
  <div class="topbar">
    <div class="brand">
      <h1>Your Chores</h1>
      <p id="topbar-sub">Keep up the great work!</p>
    </div>
    <div class="star-pill">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
          fill="#F59E0B" stroke="#D97706" stroke-width="1" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="num" id="star-count">0</div>
        <div class="lbl">Stars</div>
      </div>
    </div>
  </div>

  <!-- Next reward card -->
  <div class="reward-card-strip">
    <div class="next-reward-card">
      <div class="nrc-icon" id="nrc-icon">🍫</div>
      <div class="nrc-body">
        <div class="nrc-label">Next reward</div>
        <div class="nrc-reward" id="nrc-reward">Favorite snack of your choice!</div>
      </div>
      <div class="nrc-right">
        <div class="nrc-stars" id="nrc-stars">0 / 5</div>
        <div class="nrc-mini-track">
          <div class="nrc-mini-fill" id="nrc-mini-fill" style="width:0%"></div>
        </div>
        <button class="nrc-rewards-btn" onclick="toggleRewards()">Rewards</button>
      </div>
    </div>
  </div>

  <!-- Rewards drawer -->
  <div class="rewards-drawer" id="rewards-drawer">
    <div class="drawer-head">
      <span>Reward Milestones</span>
      <button class="drawer-close" onclick="toggleRewards()">✕</button>
    </div>
    <div class="rewards-grid" id="rewards-grid"></div>
    <button class="edit-rewards-link" onclick="openEditRewards()">Edit rewards</button>
  </div>

  <!-- Tabs -->
  <div class="tabs-row">
    <div class="tabs-inner">
      <button class="tab-btn active" onclick="switchTab('daily')" id="tab-daily">
        Daily<br><span class="t-badge" id="badge-daily">0/7</span>
      </button>
      <button class="tab-btn" onclick="switchTab('weekly')" id="tab-weekly">
        Weekly<br><span class="t-badge" id="badge-weekly">0/11</span>
      </button>
      <button class="tab-btn" onclick="switchTab('monthly')" id="tab-monthly">
        Monthly<br><span class="t-badge" id="badge-monthly">0/8</span>
      </button>
      <button class="tab-btn" onclick="switchTab('quarterly')" id="tab-quarterly">
        Quarterly<br><span class="t-badge" id="badge-quarterly">0/8</span>
      </button>
    </div>
  </div>

  <!-- Chore list -->
  <div class="chore-scroll" id="chore-scroll"></div>

  <!-- Reset -->
  <div class="reset-zone">
    <button class="reset-all-btn" onclick="confirmReset()">Reset all stars &amp; chores</button>
  </div>

</div>

<!-- Celebration modal -->
<div class="overlay" id="celebration-overlay" onclick="closeCelebration()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <span class="modal-icon" id="cel-emoji">🎉</span>
    <div class="modal-title">Milestone reached!</div>
    <div class="modal-sub" id="cel-stars"></div>
    <div class="modal-reward-lbl">Your reward</div>
    <div class="modal-reward-box" id="cel-reward"></div>
    <button class="modal-cta" onclick="closeCelebration()">Claim it! 🎉</button>
  </div>
</div>

<!-- Edit rewards modal -->
<div class="overlay" id="edit-overlay" onclick="closeEditRewards()">
  <div class="modal edit-modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">Edit Rewards</div>
    <div id="reward-edit-fields"></div>
    <div class="edit-btns">
      <button class="btn-primary" onclick="saveRewards()">Save</button>
      <button class="btn-secondary" onclick="closeEditRewards()">Cancel</button>
    </div>
  </div>
</div>

<!-- Confirm reset modal -->
<div class="overlay" id="confirm-overlay" onclick="closeConfirmReset()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <span class="modal-icon">⚠️</span>
    <div class="modal-title">Reset everything?</div>
    <div class="modal-sub">All stars, chore progress, and custom rewards will be cleared.</div>
    <div class="edit-btns">
      <button class="btn-primary" style="background:#F43F5E" onclick="doReset()">Yes, reset</button>
      <button class="btn-secondary" onclick="closeConfirmReset()">Cancel</button>
    </div>
  </div>
</div>

<script>
const STAR_PATH = 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z';

const CARD_COLORS = [
  { bg: '#FDFDE0', stroke: '#A16207' },
  { bg: '#E8F8EC', stroke: '#15803D' },
  { bg: '#E8F0FF', stroke: '#3730A3' },
  { bg: '#FCEAF0', stroke: '#9D174D' },
  { bg: '#F0EBFF', stroke: '#6D28D9' },
  { bg: '#E0F9F5', stroke: '#0F766E' },
  { bg: '#FEF0E0', stroke: '#C2410C' },
];

const CHORES = {
  daily: [
    { id: 'make-bed',  text: 'Make the bed'         },
    { id: 'dishes',    text: 'Do the dishes'         },
    { id: 'counters',  text: 'Wipe kitchen counters' },
    { id: 'tidy',      text: 'Quick 10-min tidy'     },
    { id: 'sweep',     text: 'Sweep or quick vacuum' },
    { id: 'vitamins',  text: 'Take vitamins / meds'  },
    { id: 'self-care', text: 'Self-care routine'     },
  ],
  weekly: [
    { id: 'laundry',    text: 'Do the laundry'                 },
    { id: 'vacuum',     text: 'Vacuum all rooms'               },
    { id: 'mop',        text: 'Mop floors'                     },
    { id: 'toilet',     text: 'Clean toilet & sink'            },
    { id: 'sheets',     text: 'Change bed sheets'              },
    { id: 'trash',      text: 'Take out all trash / recycling' },
    { id: 'appliances', text: 'Wipe down appliances'           },
    { id: 'grocery',    text: 'Grocery list & shop'            },

    { id: 'dust',       text: 'Dust surfaces & shelves'        },
  ],
  monthly: [
    { id: 'shower',     text: 'Scrub shower / tub'             },
    { id: 'fridge',     text: 'Deep clean the fridge'         },
    { id: 'oven',       text: 'Clean the oven'                },
    { id: 'windows',    text: 'Clean interior windows'        },
    { id: 'organize',   text: 'Organize one closet or drawer' },
    { id: 'under-furn', text: 'Clean under furniture'         },
    { id: 'baseboards', text: 'Wipe baseboards'               },
    { id: 'microwave',  text: 'Deep clean microwave'          },
    { id: 'coffee',     text: 'Descale coffee maker'          },
  ],
  quarterly: [
    { id: 'deep-appl', text: 'Deep clean all appliances'     },
    { id: 'filters',   text: 'Replace air / furnace filters' },
    { id: 'declutter', text: 'Declutter & donate items'      },

    { id: 'storage',   text: 'Organize storage / garage'     },
  ],
};

const DEFAULT_REWARDS = [
  { milestone: 5,  emoji: '🧋', text: 'Fun drink — boba, coffee, or whatever you\'re craving!' },
  { milestone: 15, emoji: '🍽️', text: 'Dinner out or DoorDash — your pick!' },
  { milestone: 30, emoji: '👗', text: 'Clothes or makeup shopping ($100 limit)!' },
  { milestone: 50, emoji: '🛍️', text: 'Spend on whatever you want — you earned it!' },
];

let state = {
  totalStars: 0,
  completedChores: { daily: [], weekly: [], monthly: [], quarterly: [] },
  lastResetDates:  { daily: '', weekly: '', monthly: '', quarterly: '' },
  celebratedMilestones: [],
  rewards: JSON.parse(JSON.stringify(DEFAULT_REWARDS)),
};
let activeTab = 'daily';

function save() { try { localStorage.setItem('choreStars', JSON.stringify(state)); } catch(e){} }
function load() {
  try {
    const raw = localStorage.getItem('choreStars');
    if (raw) {
      const parsed = JSON.parse(raw);
      state = Object.assign({}, state, parsed);
      ['daily','weekly','monthly','quarterly'].forEach(p => {
        if (!Array.isArray(state.completedChores[p])) state.completedChores[p] = [];
      });
      if (!Array.isArray(state.celebratedMilestones)) state.celebratedMilestones = [];
      if (!Array.isArray(state.rewards) || state.rewards.length !== 4 ||
          state.rewards.map(r=>r.milestone).join() !== DEFAULT_REWARDS.map(r=>r.milestone).join()) {
        state.rewards = JSON.parse(JSON.stringify(DEFAULT_REWARDS));
      }
      state.rewards.forEach((r, i) => {
        if (!r.emoji)     r.emoji     = DEFAULT_REWARDS[i].emoji;
        if (!r.text)      r.text      = DEFAULT_REWARDS[i].text;
        if (!r.milestone) r.milestone = DEFAULT_REWARDS[i].milestone;
      });
    }
  } catch(e) {}
}

function todayStr()   { return new Date().toISOString().slice(0,10); }
function weekStr()    { const d=new Date(); return d.getFullYear()+'-W'+Math.ceil((((d-new Date(d.getFullYear(),0,1))/86400000)+new Date(d.getFullYear(),0,1).getDay()+1)/7); }
function monthStr()   { const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1); }
function quarterStr() { const d=new Date(); return d.getFullYear()+'-Q'+(Math.floor(d.getMonth()/3)+1); }
const periodFn = { daily: todayStr, weekly: weekStr, monthly: monthStr, quarterly: quarterStr };

function checkAutoReset() {
  let changed = false;
  for (const p of ['daily','weekly','monthly','quarterly']) {
    const curr = periodFn[p]();
    if (state.lastResetDates[p] !== curr) {
      state.completedChores[p] = [];
      state.lastResetDates[p] = curr;
      changed = true;
    }
  }
  if (changed) save();
}

function pruneStaleIds() {
  let changed = false;
  ['daily','weekly','monthly','quarterly'].forEach(p => {
    const valid = new Set(CHORES[p].map(c => c.id));
    const before = state.completedChores[p].length;
    state.completedChores[p] = state.completedChores[p].filter(id => valid.has(id));
    if (state.completedChores[p].length !== before) changed = true;
  });
  if (changed) save();
}

const MILESTONES = [5, 15, 30, 50];
const CYCLE = 50;
function getNextMilestone(s) {
  const base = Math.floor(s/CYCLE)*CYCLE;
  for (const m of MILESTONES) { if (s < base+m) return base+m; }
  return (Math.floor(s/CYCLE)+1)*CYCLE;
}
function getPrevMilestone(s) {
  const base = Math.floor(s/CYCLE)*CYCLE;
  let prev = base;
  for (const m of MILESTONES) { if (s >= base+m) prev = base+m; else break; }
  return prev;
}
function getRewardForMilestone(m) {
  const rel = m % CYCLE || CYCLE;
  const idx = MILESTONES.indexOf(rel);
  return state.rewards[idx >= 0 ? idx : 0] || DEFAULT_REWARDS[0];
}

function render() {
  const s    = state.totalStars;
  const next = getNextMilestone(s);
  const prev = getPrevMilestone(s);
  const pct  = prev===next ? 100 : Math.round((s-prev)/(next-prev)*100);
  const r    = getRewardForMilestone(next);

  document.getElementById('star-count').textContent    = s;
  document.getElementById('nrc-icon').textContent      = r.emoji;
  document.getElementById('nrc-reward').textContent    = r.text;
  document.getElementById('nrc-stars').textContent     = s + ' / ' + next;
  document.getElementById('nrc-mini-fill').style.width = pct + '%';

  const allDone = ['daily','weekly','monthly','quarterly'].reduce((t,p) => t + state.completedChores[p].length, 0);
  document.getElementById('topbar-sub').textContent = allDone === 0
    ? 'Keep up the great work!'
    : allDone + ' chore' + (allDone!==1?'s':'') + ' done';

  renderRewardCards();
  renderChoreList();
  renderBadges();
}

function renderRewardCards() {
  const s    = state.totalStars;
  const next = getNextMilestone(s);
  const grid = document.getElementById('rewards-grid');
  grid.innerHTML = '';

  let currentCardEl = null;
  const NUM_CYCLES = 3;

  for (let cycle = 0; cycle < NUM_CYCLES; cycle++) {
    const base = cycle * CYCLE;
    MILESTONES.forEach((m, idx) => {
      const absM    = base + m;
      const reward  = state.rewards[idx];
      const unlocked = s >= absM;
      const isCurrent = absM === next;

      const card = document.createElement('div');
      card.className = 'r-card' + (unlocked ? ' unlocked' : '') + (isCurrent ? ' current' : '');
      card.innerHTML = `
        <div class="rc-icon">${unlocked ? '✓' : reward.emoji}</div>
        <div class="rc-stars">${absM} ⭐</div>
        <div class="rc-t">${reward.text}</div>
      `;
      grid.appendChild(card);
      if (isCurrent) currentCardEl = card;
    });
  }

  // Scroll the current target into view
  if (currentCardEl) {
    setTimeout(() => currentCardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }), 60);
  }
}

function renderChoreList() {
  const section = document.getElementById('chore-scroll');
  const chores  = CHORES[activeTab];
  const done    = state.completedChores[activeTab];
  const total   = chores.length;
  const dc      = done.length;
  const titles  = { daily:'Daily', weekly:'Weekly', monthly:'Monthly', quarterly:'Quarterly' };

  section.innerHTML = `
    <div class="section-head">
      <div class="section-head-l">
        <div class="section-title">${titles[activeTab]} Chores</div>
        <div class="section-sub">${dc} of ${total} completed</div>
      </div>
      ${dc < total ? `<button class="complete-all-btn" onclick="completeAll()">Complete all</button>` : ''}
    </div>
    <div class="chore-list" id="chore-list"></div>
    <div class="period-bar">
      <div class="pb-label">${dc} / ${total} done this period</div>
      <div class="pb-track"><div class="pb-fill" style="width:${total?Math.round(dc/total*100):0}%"></div></div>
    </div>
  `;

  const list = document.getElementById('chore-list');
  chores.forEach((chore, idx) => {
    const isDone = done.includes(chore.id);
    const color  = CARD_COLORS[idx % CARD_COLORS.length];
    const item   = document.createElement('div');
    item.className = 'chore-item' + (isDone?' done':'');
    item.dataset.id = chore.id;
    item.style.background = color.bg;
    item.innerHTML = `
      <svg class="star-cb${isDone?' checked':''}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="${STAR_PATH}"
          fill="${isDone ? '#F59E0B' : 'none'}"
          stroke="${isDone ? '#D97706' : color.stroke}"
          stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span class="chore-text">${chore.text}</span>
    `;
    item.addEventListener('click', () => toggleChore(chore.id));
    list.appendChild(item);
  });
}

function renderBadges() {
  ['daily','weekly','monthly','quarterly'].forEach(p => {
    const el = document.getElementById('badge-'+p);
    if (el) el.textContent = state.completedChores[p].length+'/'+CHORES[p].length;
  });
}

function toggleChore(id) {
  const list = state.completedChores[activeTab];
  const idx  = list.indexOf(id);
  const item = document.querySelector('.chore-item[data-id="'+id+'"]');

  if (idx === -1) {
    list.push(id);
    state.totalStars++;
    save();

    if (item) {
      const f = document.createElement('div');
      f.className = 'star-float';
      f.innerHTML = `+1 <svg width="13" height="13" viewBox="0 0 24 24"><path d="${STAR_PATH}" fill="#F59E0B" stroke="#D97706" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
      item.appendChild(f);
      setTimeout(() => f.remove(), 850);
    }

    const el = document.getElementById('star-count');
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');

    const base = Math.floor((state.totalStars-1)/CYCLE)*CYCLE;
    const hit  = MILESTONES.map(m=>base+m).find(m=>m===state.totalStars);
    if (hit && !state.celebratedMilestones.includes(hit)) {
      state.celebratedMilestones.push(hit);
      save();
      setTimeout(() => celebrate(hit), 550);
    }
  } else {
    list.splice(idx, 1);
    if (state.totalStars > 0) state.totalStars--;
    save();
  }
  render();
}

function completeAll() {
  const chores = CHORES[activeTab];
  const list   = state.completedChores[activeTab];
  const before = state.totalStars;
  chores.forEach(c => { if (!list.includes(c.id)) { list.push(c.id); state.totalStars++; } });
  if (state.totalStars > before) {
    save();
    const el = document.getElementById('star-count');
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    for (let s = before+1; s <= state.totalStars; s++) {
      const base = Math.floor((s-1)/CYCLE)*CYCLE;
      if (MILESTONES.map(m=>base+m).includes(s) && !state.celebratedMilestones.includes(s)) {
        state.celebratedMilestones.push(s);
        const cap = s;
        setTimeout(() => celebrate(cap), 400);
        break;
      }
    }
    save();
  }
  render();
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  renderChoreList();
}

function toggleRewards() {
  document.getElementById('rewards-drawer').classList.toggle('open');
  renderRewardCards();
}

function celebrate(stars) {
  const r = getRewardForMilestone(stars);
  document.getElementById('cel-emoji').textContent  = r.emoji;
  document.getElementById('cel-stars').textContent  = "You've earned "+stars+" star"+(stars!==1?'s':'')+"!";
  document.getElementById('cel-reward').textContent = r.text;
  document.getElementById('celebration-overlay').classList.add('show');
  launchConfetti();
}
function closeCelebration() {
  document.getElementById('celebration-overlay').classList.remove('show');
  stopConfetti();
}

let confAnim = null;
const CONF_COLORS = ['#5B5BD6','#F59E0B','#EC4899','#10B981','#818CF8','#F97316'];
function launchConfetti() {
  const cv = document.getElementById('confetti-canvas');
  cv.style.display = 'block'; cv.width = innerWidth; cv.height = innerHeight;
  const ctx = cv.getContext('2d');
  const pp  = Array.from({length:110}, () => ({
    x:Math.random()*cv.width, y:-20,
    w:6+Math.random()*7, h:4+Math.random()*5,
    color:CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)],
    vx:(Math.random()-.5)*4, vy:2+Math.random()*4,
    rot:Math.random()*Math.PI*2, vr:(Math.random()-.5)*.18, alpha:1
  }));
  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height); let alive=false;
    pp.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.rot+=p.vr;
      if(p.y>cv.height*.65) p.alpha-=.025;
      if(p.alpha>0) alive=true;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.alpha);
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    confAnim = alive ? requestAnimationFrame(draw) : null;
    if (!alive) stopConfetti();
  }
  if (confAnim) cancelAnimationFrame(confAnim);
  confAnim = requestAnimationFrame(draw);
}
function stopConfetti() {
  if(confAnim){cancelAnimationFrame(confAnim);confAnim=null;}
  const cv=document.getElementById('confetti-canvas');
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
  cv.style.display='none';
}

function openEditRewards() {
  document.getElementById('reward-edit-fields').innerHTML = state.rewards.map((r,i) => `
    <div class="edit-field">
      <label>${r.emoji} ${r.milestone}-star reward</label>
      <input type="text" id="ri-${i}" value="${r.text}">
    </div>
  `).join('');
  document.getElementById('edit-overlay').classList.add('show');
}
function closeEditRewards() { document.getElementById('edit-overlay').classList.remove('show'); }
function saveRewards() {
  state.rewards.forEach((r,i) => {
    const v = document.getElementById('ri-'+i).value.trim();
    if(v) r.text = v;
  });
  save(); closeEditRewards(); render();
}

function confirmReset()      { document.getElementById('confirm-overlay').classList.add('show'); }
function closeConfirmReset() { document.getElementById('confirm-overlay').classList.remove('show'); }
function doReset() {
  state.totalStars=0;
  state.completedChores={daily:[],weekly:[],monthly:[],quarterly:[]};
  state.celebratedMilestones=[];
  state.lastResetDates={daily:'',weekly:'',monthly:'',quarterly:''};
  state.rewards=JSON.parse(JSON.stringify(DEFAULT_REWARDS));
  save(); closeConfirmReset(); render();
}

load();
checkAutoReset();
pruneStaleIds();
render();
</script>
</body>
</html>
